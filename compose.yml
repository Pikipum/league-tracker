services:
  db:
    image: postgres
    shm_size: 128mb
    environment:
      POSTGRES_PASSWORD: example
    ports:
      - 5432:5432
    volumes:
      - db_data:/var/lib/postgresql

  backend:
    build: ./backend
    image: league-tracker/backend:latest
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env_docker
    depends_on:
      - db

  frontend:
    command: sh -c "apk add --no-cache netcat-openbsd && \
      while ! nc -z backend 4000; do sleep 1; done; \
      nginx -g 'daemon off;'"
    build:
      context: .
      args:
        REACT_APP_API_URL: "${REACT_APP_API_URL}"             # should be public API URL (browser)
    image: league-tracker/frontend:latest
    ports:
      - "80:80"
    env_file:
      - .env_docker
    depends_on:
      - backend
volumes:
  db_data: